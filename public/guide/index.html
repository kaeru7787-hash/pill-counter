<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピクト君と使う 錠数ノート｜操作漫画</title>
<style>
*{box-sizing:border-box}html{color-scheme:light;scroll-behavior:smooth}body{margin:0;background:#edf5f3;color:#103454;font-family:system-ui,"Yu Gothic",sans-serif}header,footer{max-width:900px;margin:auto;padding:20px 16px;text-align:center}h1{font-size:20px;margin:0 0 12px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}a{color:#124976;text-underline-offset:4px}nav a{padding:8px 12px;border-radius:20px;background:white;font-size:14px}main{max-width:900px;margin:auto;background:white;box-shadow:0 4px 28px #10345412}figure{margin:0;background:white;scroll-margin-top:12px}figure+figure{border-top:12px solid #edf5f3}img{width:100%;height:auto;display:block}figcaption{padding:14px;text-align:center;font-size:14px;background:#fff}footer{font-size:13px;line-height:1.8}p{margin:8px 0}@media print{header,footer,figcaption{display:none}body{background:white}main{box-shadow:none;max-width:none}figure{break-after:page}figure+figure{border:0}}
</style>
</head>
<body>
<header><h1>ピクト君と使う 錠数ノート</h1><nav aria-label="各章へ移動"><a href="#count">① 撮影・検出</a><a href="#edit">② 編集・拡大</a><a href="#save">③ 確認・保存</a></nav></header>
<main>
<figure id="count"><img src="01-count.png" alt="第1章。錠剤・点眼ボトルを選び、撮影または写真を選択。錠剤・点眼それぞれの専用AIが自動で検出を補助。点眼AIは少数写真で学習した試作。緑の輪郭は画像処理、濃い青の四角はAI補助、水色は手動追加。最後は目で確認。"><figcaption><a href="01-count.png" download>第1章の画像を保存</a></figcaption></figure>
<figure id="edit"><img src="02-edit.png" loading="lazy" alt="第2章。選択、追加、削除で結果を編集。範囲指定と解除は再解析、範囲削除はまとめて削除。元に戻す、やり直す、補正を全リセット。番号付き画像を拡大は閲覧専用、編集画面の拡大バーでは拡大して編集できる。"><figcaption><a href="02-edit.png" download>第2章の画像を保存</a></figcaption></figure>
<figure id="save"><img src="03-save.png" loading="lazy" alt="第3章。すべての番号と数え漏れを目視確認してチェック。結果画像を保存すると番号と編集結果、右下の個数入りPNGを保存できる。補正から端末内で自動学習。次の画像・終了時に反映し、学習用画像は残しません。"><figcaption><a href="03-save.png" download>第3章の画像を保存</a></figcaption></figure>
</main>
<footer><p>錠数ノート v0.11.0 の仕様を確認した操作ガイドです。画面図は説明用に簡略化しています。</p><a href="#">先頭に戻る ↑</a></footer>
</body>
</html>
