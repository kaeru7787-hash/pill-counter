<body>
<header><h1>ピクト君と使う 錠数ノート</h1><nav aria-label="各章へ移動"><a href="#count">① 撮影・検出</a><a href="#edit">② 編集・拡大</a><a href="#save">③ 確認・保存</a></nav></header>
<main>
<figure id="count"><img src="01-count.png" alt="第1章。錠剤・点眼ボトルを選び、撮影または写真を選択。錠剤・点眼それぞれの専用AIが自動で検出を補助。点眼AIは少数写真で学習した試作。錠剤は1錠に1つの楕円と中心の番号。水色の実線は光学認識、青の実線はAI追加、橙の破線は要確認。要確認も個数に含まれます。全体の数え漏れも目で確認。"><figcaption><p>錠剤の楕円マーク：水色の実線＝光学認識／青の実線＝AI追加／橙の破線＝要確認。要確認も個数に含まれます。</p><a href="01-count.png" download>第1章の画像を保存</a></figcaption></figure>
<figure id="edit"><img src="02-edit.png" loading="lazy" alt="第2章。「拡大・縮小」中は検出画像を2本指で拡大・縮小、拡大後は1本指で移動。番号のタップで選択もできます。追加・削除へ切り替えると、倍率と表示位置を保って編集できます。追加・削除中はピンチ操作できません。元に戻す、やり直す、補正を全リセット。拡大バーと全体を表示でも調整できます。"><figcaption><p>「拡大・縮小」で2本指のピンチ操作。拡大後は1本指で移動し、「追加」「削除」に切り替えて補正できます。</p><a href="02-edit.png" download>第2章の画像を保存</a></figcaption></figure>
<figure id="save"><img src="03-save.png" loading="lazy" alt="第3章。橙の破線を優先して確認し、実物と画像全体を見比べます。要確認も個数に含まれます。余分な番号は削除し、数え漏れは追加。結果画像を保存すると番号と編集結果、右下の個数入りPNGを保存できます。保存方法は端末・ブラウザーによります。補正は今の写真だけに反映。次の写真も番号を確認します。"><figcaption><p>破線だけでなく、番号の重複・余分な番号・数え漏れを全体で確認してから「結果画像を保存」。</p><a href="03-save.png" download>第3章の画像を保存</a></figcaption></figure>
</main>
